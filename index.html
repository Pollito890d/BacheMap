<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f4f1;
            /* Color de fondo claro y neutral */
        }

        .login-container {
            background-color: #ffffff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            /* Sombra suave para darle profundidad */
            text-align: center;
            width: 320px;
        }

        /* Espacio reservado para la imagen circular */
        .profile-placeholder {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background-color: #e0e0e0;
            /* Color gris temporal */
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Descomenta la etiqueta img en el HTML cuando tengas la imagen, esta clase le dará el estilo correcto */
        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.15); /* Esto hace un pequeño zoom para que el logo abarque más espacio */
        }

        h2 {
            margin: 0 0 30px 0;
            font-size: 28px;
            color: #000;
            font-weight: bold;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            justify-content: space-between;
        }

        .form-group label {
            flex: 0 0 90px;
            /* Ancho fijo para las etiquetas para que se alineen los inputs */
            text-align: left;
            font-size: 15px;
            color: #333;
        }

        .form-group input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #000;
            /* Borde negro como en la imagen */
            border-radius: 0;
            /* Bordes rectos como en la imagen */
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #a32a2a;
            /* Cambio de color al enfocar */
        }

        .submit-btn {
            background-color: #C05746;
            /* Color basado en la imagen proporcionada */
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 2px;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #a84838;
            /* Color más oscuro al pasar el mouse */
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- Círculo para la imagen -->
        <div class="profile-placeholder">
            <img src="logo.jpeg" alt="Perfil" class="profile-img">
        </div>

        <h2>BacheMap</h2>

        <form action="Principal.html" method="GET">
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username">
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password">
            </div>

            <!-- Botón cambiado de "Aceptar" a "Entrar" -->
            <button type="submit" class="submit-btn">Iniciar Sesión</button>
        </form>

    </div>

</body>

</html>
