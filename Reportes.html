        <!-- Sección de Gráfico Único Dinámico -->
        <h4 class="fw-bold mt-5 mb-4 text-dark text-center">Análisis de Reportes por Zona</h4>
        <div class="row justify-content-center">
            <div class="col-md-10">

                    <!-- Botones de Control de Tiempo -->
                    <div class="d-flex justify-content-center gap-2 mb-4 flex-wrap">
                        <button class="btn btn-outline-dark rounded-pill fw-bold"
                            onclick="updateChart('diario', this)">Diario</button>
                        <button class="btn btn-outline-dark rounded-pill fw-bold active"
                            onclick="updateChart('semanal', this)">Semanal</button>
                        <button class="btn btn-outline-dark rounded-pill fw-bold"
                            onclick="updateChart('mensual', this)">Mensual</button>
                        <button class="btn btn-outline-dark rounded-pill fw-bold"
                            onclick="updateChart('trimestral', this)">Trimestral</button>
                        <button class="btn btn-outline-dark rounded-pill fw-bold"
                            onclick="updateChart('anual', this)">Anual</button>
                    </div>

                    <!-- Lienzo del Gráfico -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Colores súper vivos (Rojo, Azul, Verde, Naranja)
        const vividColors = ['#FF2A2A', '#007BFF', '#00E640', '#FF9900'];
        const zonas = ['Oaxaca de Juárez', 'Xoxocotlán', 'Santa Lucía', 'Zaachila'];

        // Datos para cada periodo de tiempo
        const chartData = {
            diario: [2, 1, 0, 1],
            semanal: [5, 8, 3, 6],
            mensual: [25, 38, 15, 30],
            trimestral: [80, 120, 45, 95],
            anual: [340, 450, 210, 390]
        };

        // Crear el gráfico principal (Barras Horizontales)
        const ctx = document.getElementById('mainChart').getContext('2d');
        let myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: zonas,
                datasets: [{
                    label: 'Reportes',
                    data: chartData.semanal,
                    backgroundColor: vividColors,
                    borderRadius: 6, // Hace que las puntas de las barras sean redonditas
                    borderWidth: 0
                }]
            },
            options: {
                indexAxis: 'y', // Propiedad clave para que sea horizontal
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false } // Ocultamos la leyenda para que se vea más limpio
                },
                scales: {
                    x: { beginAtZero: true }
                }
            }
        });

        // Función para cambiar los datos cuando se presiona un botón
        function updateChart(period, btnElement) {
            // 1. Actualizar los datos del gráfico con animación
            myChart.data.datasets[0].data = chartData[period];
            myChart.update();

            // 2. Quitar el estado 'active' de todos los botones
            const buttons = document.querySelectorAll('.btn-outline-dark');
            buttons.forEach(btn => btn.classList.remove('active'));

            // 3. Poner el estado 'active' al botón que se acaba de presionar
            btnElement.classList.add('active');
        }
    </script>
    <script>
  const SUPABASE_URL = 'https://muhpuwittgecylwtixku.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_TCj4IljMPd_r9PMn_xLmIQ_ckANVu8H';
  // Esta variable 'supabase' es la que usarás para todo
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);



  // Función para decodificar formato EWKB (Extended Well-Known Binary) de PostGIS
  function parseEWKBPoint(hexString) {
      if (!hexString || typeof hexString !== 'string') return null;
      try {
          // Buscamos si es Little Endian ('01')
          let littleEndian = hexString.substring(0, 2) === '01';
          
          let typeHex = hexString.substring(2, 10);
          // SRID flag en EWKB es 0x20000000. Point es 1. Así que 20000001 (big endian) o 01000020 (little endian)
          let hasSRID = typeHex === '01000020' || typeHex === '20000001'; 
          
          let offset = 10;
          if (hasSRID) offset += 8; // Saltar el SRID de 4 bytes (8 caracteres hexadecimales)
          
          let xHex = hexString.substring(offset, offset + 16);
          let yHex = hexString.substring(offset + 16, offset + 32);
          
          function hexToFloat64(hex) {
              if (hex.length !== 16) return 0;
              let bytes = new Uint8Array(8);
              for (let i = 0; i < 8; i++) {
                  bytes[i] = parseInt(hex.substring(i * 2, i * 2 + 2), 16);
              }
              let view = new DataView(bytes.buffer);
              return view.getFloat64(0, littleEndian);
          }
          
          let lng = hexToFloat64(xHex);
          let lat = hexToFloat64(yHex);
          
          return { lat, lng };
      } catch(e) {
          console.error("Error parseando EWKB:", e);
          return null;
      }
  }

  async function cargarReportes() {
        const { data, error } = await supabaseClient
            .from('Bache') // Tu tabla con baches de Oaxaca
            .select('*');

        if (error) {
            console.error('Error al cargar:', error);
            return;
        }

        const tabla = document.getElementById('tabla-reportes');
        tabla.innerHTML = ''; // Limpiamos la tabla

        data.forEach(bache => {
    const fila = document.createElement('tr');
    fila.style.borderBottom = "1px solid #f1f1f1";

    let textoUbicacion = "Sin coordenadas";
    let botonMapaHtml = `<button class="btn btn-sm btn-outline-secondary rounded-pill" disabled>Ver Mapa</button>`;
    
    // Si la ubicación viene como texto binario hexadecimal de PostGIS
    if (bache.Ubicacion && typeof bache.Ubicacion === 'string') {
        const coords = parseEWKBPoint(bache.Ubicacion);
        if (coords) {
            textoUbicacion = `Lat: ${coords.lat.toFixed(4)}, Lon: ${coords.lng.toFixed(4)}`;
            botonMapaHtml = `<a href="https://www.google.com/maps?q=${coords.lat},${coords.lng}" target="_blank" class="btn btn-sm btn-outline-success rounded-pill">Ver Mapa</a>`;
        }
    } else if (bache.Ubicacion && bache.Ubicacion.coordinates) {
        // Fallback por si la devuelven como GeoJSON de alguna forma
        const lng = bache.Ubicacion.coordinates[0];
        const lat = bache.Ubicacion.coordinates[1];
        textoUbicacion = `Lat: ${lat.toFixed(4)}, Lon: ${lng.toFixed(4)}`;
        botonMapaHtml = `<a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" class="btn btn-sm btn-outline-success rounded-pill">Ver Mapa</a>`;
    }

    // 2. Pintamos la fila con seguridad
    fila.innerHTML = `
        <td class="py-4 text-dark fw-bold">${bache.Id_bache}</td>
        <td class="text-muted">${textoUbicacion}</td>
        <td>
            <span class="badge ${bache.Valor_impacto > 7 ? 'bg-danger' : 'bg-warning'}">
                ${bache.Valor_impacto || 0}
            </span>
        </td>
        <td>
            ${botonMapaHtml}
        </td>
    `;
    tabla.appendChild(fila);
});
    }

    // Ejecutar la función al cargar la página
    document.addEventListener('DOMContentLoaded', cargarReportes);
</script>
